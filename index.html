<!DOCTYPE html>
<html>

<head>
    <title>SSH Web Terminal</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm/css/xterm.css" />
    <style>
        :root {
            --tab-height: 40px;
            --bar-height: 29px;
            --bg-color: #1e1e1e;
            --tab-bg: #252526;
            --tab-active-bg: #333333;
            --border-color: #333;
        }

        body,
        html {
            margin: 0;
            padding: 0;
            height: 100%;
            background-color: var(--bg-color);
            color: #ccc;
            font-family: sans-serif;
            overflow: hidden;
        }

        #app-container {
            display: flex;
            flex-direction: row;
            height: 100vh;
        }

        #main-workspace {
            display: flex;
            flex-direction: column;
            flex: 1;
            min-width: 0;
            height: 100%;
        }

        #tab-bar {
            display: flex;
            align-items: center;
            background-color: var(--tab-bg);
            height: var(--tab-height);
            flex-shrink: 0;
            border-bottom: 1px solid var(--border-color);
        }

        #terminal-panes {
            flex-grow: 1;
            position: relative;
            min-height: 0;
        }

        #chat-panel {
            width: 360px;
            min-width: 240px;
            max-width: min(70vw, 720px);
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            background: #1a1a1a;
            border-left: 1px solid var(--border-color);
            height: 100%;
            position: relative;
        }

        #chat-resize-handle {
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 5px;
            cursor: col-resize;
            z-index: 5;
            background: transparent;
        }

        #chat-resize-handle:hover,
        #chat-panel.resizing #chat-resize-handle {
            background: #0e639c88;
        }

        body.chat-resizing {
            cursor: col-resize;
            user-select: none;
        }

        body.chat-resizing iframe,
        body.chat-resizing .xterm {
            pointer-events: none;
        }

        #chat-panel.collapsed {
            width: 36px !important;
            min-width: 36px;
            max-width: 36px;
            overflow: visible;
            z-index: 30;
        }

        #chat-panel.collapsed #chat-body,
        #chat-panel.collapsed #chat-input-area,
        #chat-panel.collapsed #chat-status,
        #chat-panel.collapsed #chat-resize-handle,
        #chat-panel.collapsed #chat-header h3,
        #chat-panel.collapsed #chat-clear {
            display: none !important;
        }

        #chat-panel.collapsed #chat-header {
            padding: 0;
            justify-content: center;
            border-bottom: none;
            height: 100%;
            min-height: var(--tab-height);
            flex-direction: column;
        }

        #chat-panel.collapsed #chat-header > div {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
        }

        #chat-panel.collapsed #chat-toggle {
            width: 100%;
            height: 100%;
            min-height: var(--tab-height);
            flex: 1;
            border: none;
            border-radius: 0;
            padding: 0;
            margin: 0;
            font-size: 1.15rem;
            line-height: 1;
            background: var(--tab-bg);
        }

        #chat-panel.collapsed #chat-toggle:hover {
            background: #3a3a3a;
            color: #fff;
        }

        #chat-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 10px;
            background: var(--tab-bg);
            border-bottom: 1px solid var(--border-color);
            flex-shrink: 0;
            height: var(--tab-height);
            box-sizing: border-box;
            gap: 6px;
            min-width: 0;
            position: relative;
            z-index: 2;
        }

        #chat-header h3 {
            margin: 0;
            font-size: 0.95rem;
            font-weight: 600;
            color: #ddd;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            min-width: 0;
            flex: 1;
        }

        #chat-header > div {
            display: flex;
            gap: 4px;
            align-items: center;
            flex-shrink: 0;
        }

        #chat-toggle {
            background: transparent;
            border: 1px solid #444;
            color: #ccc;
            cursor: pointer;
            padding: 2px 8px;
            border-radius: 4px;
            flex-shrink: 0;
            position: relative;
            z-index: 3;
        }

        #chat-status {
            font-size: 0.75rem;
            padding: 4px 10px;
            color: #888;
            border-bottom: 1px solid var(--border-color);
            flex-shrink: 0;
        }

        #chat-status.ok { color: #6abf69; }
        #chat-status.err { color: #e57373; }

        #chat-body {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
            min-height: 0;
        }

        .chat-msg {
            margin-bottom: 10px;
            padding: 8px 10px;
            border-radius: 8px;
            font-size: 0.88rem;
            line-height: 1.45;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .chat-msg.user {
            background: #0e639c33;
            border: 1px solid #147ab855;
            margin-left: 12px;
        }

        .chat-msg.assistant {
            background: #2a2a2a;
            border: 1px solid #3a3a3a;
            margin-right: 8px;
        }

        .chat-msg.system {
            background: transparent;
            color: #888;
            font-size: 0.8rem;
            border: none;
            padding: 4px 0;
        }

        .chat-msg .tool-trace {
            margin-top: 6px;
            font-size: 0.75rem;
            color: #9cdcfe;
            opacity: 0.85;
        }

        #chat-input-area {
            border-top: 1px solid var(--border-color);
            padding: 8px;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        #chat-input {
            width: 100%;
            min-height: 64px;
            max-height: 140px;
            resize: vertical;
            box-sizing: border-box;
            background: #111;
            color: #d4d4d4;
            border: 1px solid #333;
            border-radius: 6px;
            padding: 8px;
            font-family: inherit;
            font-size: 0.9rem;
        }

        #chat-send {
            align-self: flex-end;
        }

        #chat-send:disabled {
            opacity: 0.5;
            cursor: default;
        }

        .terminal-pane {
            display: none;
            flex-direction: column;
            width: 100%;
            height: 100%;
        }

        .terminal-pane.active {
            display: flex;
        }

        .shortcuts-bar-container {
            display: flex;
            align-items: center;
            height: var(--bar-height);
            background-color: var(--tab-bg);
            flex-shrink: 0;
        }

        .shortcuts-bar {
            display: flex;
            align-items: center;
            overflow: hidden;
            scroll-behavior: smooth;
            flex-grow: 1;
            height: 100%;
        }

        .xterm-container {
            flex-grow: 1;
            position: relative;
        }

        .xterm-container .terminal,
        .xterm-container .xterm-viewport {
            width: 100% !important;
            height: 100% !important;
        }

        .shortcuts-bar .btn {
            padding: 2px 4px;
            margin: 2px;
            font-size: 0.8rem;
            flex-shrink: 0;
        }

        .shortcuts-bar-container .scroll-btn {
            background-color: var(--tab-bg);
            color: #ccc;
            border: none;
            cursor: pointer;
            padding: 0 8px;
            height: 100%;
            font-size: 1rem;
            line-height: var(--bar-height);
        }

        .shortcuts-bar-container .scroll-btn:hover {
            background-color: #4f4f4f;
        }

        .shortcuts-bar-container .scroll-btn:disabled {
            opacity: 0.2;
            cursor: default;
        }

        .shortcuts-bar-container .scroll-btn.left {
            border-right: 1px solid var(--border-color);
        }

        .shortcuts-bar-container .scroll-btn.right {
            border-left: 1px solid var(--border-color);
        }

        .tab {
            display: flex;
            align-items: center;
            padding: 0 15px;
            height: 100%;
            border-right: 1px solid var(--border-color);
            cursor: pointer;
            gap: 6px;
            position: relative;
        }

        .tab.active {
            background-color: var(--tab-active-bg);
        }

        .tab.ai-owned {
            box-shadow: inset 0 -2px 0 #e0a100;
        }

        .tab.ai-active {
            background: linear-gradient(180deg, #3d3200 0%, var(--tab-bg) 100%);
            animation: ai-tab-pulse 1.2s ease-in-out infinite;
        }

        .tab.ai-active.active {
            background: linear-gradient(180deg, #4a3c00 0%, var(--tab-active-bg) 100%);
        }

        @keyframes ai-tab-pulse {
            0%, 100% { box-shadow: inset 0 -2px 0 #e0a100; }
            50% { box-shadow: inset 0 -2px 0 #ffd54f, 0 0 8px #e0a10055; }
        }

        .tab-ai-badge {
            font-size: 0.65rem;
            font-weight: 700;
            letter-spacing: 0.04em;
            color: #1a1a1a;
            background: #ffc107;
            border-radius: 3px;
            padding: 1px 4px;
            line-height: 1.2;
            flex-shrink: 0;
        }

        .tab-ai-badge.live {
            background: #ff9800;
            animation: ai-badge-blink 0.9s step-end infinite;
        }

        @keyframes ai-badge-blink {
            50% { opacity: 0.45; }
        }

        .tab-close {
            margin-left: 4px;
            padding: 2px 5px;
            border-radius: 4px;
        }

        .tab-close:hover {
            background-color: rgba(255, 255, 255, 0.1);
        }

        .terminal-pane.ai-active-pane {
            outline: 2px solid #e0a100;
            outline-offset: -2px;
        }

        .ai-pane-banner {
            display: none;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
            padding: 4px 10px;
            font-size: 0.78rem;
            color: #1a1200;
            background: linear-gradient(90deg, #ffc107, #ff9800);
            border-bottom: 1px solid #c79100;
            font-family: sans-serif;
            z-index: 4;
        }

        .terminal-pane.ai-active-pane .ai-pane-banner {
            display: flex;
        }

        .ai-pane-banner strong {
            font-weight: 700;
        }

        .ai-pane-banner code {
            font-size: 0.75rem;
            background: rgba(0,0,0,0.12);
            padding: 1px 6px;
            border-radius: 3px;
            max-width: 60%;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        #ai-control-banner {
            display: none;
            align-items: center;
            gap: 10px;
            flex-shrink: 0;
            padding: 6px 12px;
            font-size: 0.82rem;
            color: #1a1200;
            background: linear-gradient(90deg, #ffb300, #ff8f00);
            border-bottom: 1px solid #e65100;
            z-index: 20;
        }

        #ai-control-banner.visible {
            display: flex;
        }

        #ai-control-banner .ai-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #1a1200;
            animation: ai-badge-blink 0.9s step-end infinite;
            flex-shrink: 0;
        }

        #ai-control-banner .hosts {
            opacity: 0.9;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        #new-tab-btn {
            padding: 0 15px;
            font-size: 24px;
            cursor: pointer;
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-box {
            padding: 2rem;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background-color: var(--tab-bg);
            width: 80%;
            max-width: 500px;
        }

        .modal-box h2 {
            margin-top: 0;
            text-align: center;
        }

        #server-select {
            font-size: 1rem;
            padding: 0.5rem;
            width: calc(100% - 1rem - 110px);
            margin-right: 0.5rem;
        }

        .btn {
            font-size: 1rem;
            padding: 0.5rem 1rem;
            cursor: pointer;
            border: 1px solid #444;
            background-color: #3c3c3c;
            color: #ccc;
            margin-left: 4px;
        }

        .btn-primary {
            background-color: #0e639c;
            border-color: #147ab8;
            color: #fff;
        }

        .btn-group {
            margin-top: 1rem;
            display: flex;
            justify-content: space-between;
        }

        textarea {
            width: 100%;
            height: 300px;
            box-sizing: border-box;
            background: #1a1a1a;
            color: #d4d4d4;
            border: 1px solid #333;
            font-family: monospace;
        }

        .editor-buttons {
            margin-top: 1rem;
            text-align: right;
        }

        .message-area {
            margin-top: 1rem;
            text-align: center;
            color: #f00;
        }

        .loading-spinner {
            display: none;
            border: 4px solid rgba(255, 255, 255, .3);
            border-radius: 50%;
            border-top-color: #fff;
            width: 24px;
            height: 24px;
            animation: spin .8s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>
    <div id="app-container">
        <div id="main-workspace">
            <div id="ai-control-banner" role="status" aria-live="polite">
                <span class="ai-dot" aria-hidden="true"></span>
                <span id="ai-control-banner-text"><strong>AI 正在操作終端</strong></span>
                <span class="hosts" id="ai-control-banner-hosts"></span>
            </div>
            <div id="tab-bar">
                <div id="new-tab-btn">+</div>
            </div>
            <div id="terminal-panes"></div>
        </div>
        <aside id="chat-panel">
            <div id="chat-resize-handle" title="Drag to resize"></div>
            <div id="chat-header">
                <h3>AI Ops</h3>
                <div>
                    <button type="button" id="chat-clear" class="btn" title="Clear chat" style="padding:2px 8px; font-size:0.75rem; margin:0;">Clear</button>
                    <button type="button" id="chat-toggle" title="Collapse / Expand">⟩</button>
                </div>
            </div>
            <div id="chat-status">Checking AI…</div>
            <div id="chat-body"></div>
            <div id="chat-input-area">
                <textarea id="chat-input" placeholder="例如：打開某台機器並查 df -h（Enter 換行，點 Send 送出）" rows="3"></textarea>
                <button type="button" id="chat-send" class="btn btn-primary">Send</button>
            </div>
        </aside>
    </div>
    <div id="login-modal" class="modal-overlay">
        <div class="modal-box">
            <h2>Login</h2>
            <div class="message-area" id="login-error-message"></div>
            <div>
                <input type="text" id="username-input" placeholder="Username"
                    style="width: 100%; padding: 8px; margin-bottom: 10px; box-sizing: border-box; background: #1a1a1a; color: #d4d4d4; border: 1px solid #333;" />
                <input type="password" id="password-input" placeholder="Password"
                    style="width: 100%; padding: 8px; margin-bottom: 10px; box-sizing: border-box; background: #1a1a1a; color: #d4d4d4; border: 1px solid #333;" />
                <button id="login-btn" class="btn btn-primary" style="width: 100%;">Login</button>
            </div>
        </div>
    </div>
    <div id="connect-modal" class="modal-overlay"></div>
    <div id="hosts-editor-modal" class="modal-overlay"></div>
    <div id="shortcuts-editor-modal" class="modal-overlay"></div>
    <div id="host-select-modal" class="modal-overlay"></div>
    <div id="batch-run-modal" class="modal-overlay"></div>
    <div id="batch-shortcuts-editor-modal" class="modal-overlay"></div>

    <script src="https://cdn.jsdelivr.net/npm/xterm/lib/xterm.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit/lib/xterm-addon-fit.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xterm-addon-serialize/lib/xterm-addon-serialize.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const loginModal = document.getElementById('login-modal');
            const appContainer = document.getElementById('app-container');
            const modals = { connect: document.getElementById('connect-modal'), hostsEditor: document.getElementById('hosts-editor-modal'), shortcutsEditor: document.getElementById('shortcuts-editor-modal'), hostSelectModal: document.getElementById('host-select-modal'), batchRun: document.getElementById('batch-run-modal'), batchShortcutsEditor: document.getElementById('batch-shortcuts-editor-modal') };
            modals.connect.innerHTML = `<div class="modal-box"><h2>Select Host</h2><p>Start typing to filter hosts.</p><div class="message-area" id="connect-error-message"></div><div class="loading-spinner" id="connect-loading-spinner"></div><div><input list="server-list" id="server-input" autocomplete="off" style="font-size: 1rem; padding: 0.5rem; width: calc(100% - 1rem - 110px); margin-right: 0.5rem; background: #1a1a1a; color: #d4d4d4; border: 1px solid #333; box-sizing: border-box;"/><datalist id="server-list"></datalist><button id="connect-btn" class="btn btn-primary">Connect</button></div><div class="btn-group"><button id="edit-hosts-btn" class="btn">Edit Hosts</button><button id="edit-shortcuts-btn" class="btn">Edit Shortcuts</button><button id="batch-run-btn" class="btn">Batch Run</button><button id="logout-btn" class="btn">Logout</button></div></div>`;
            modals.batchRun.innerHTML = `<div class="modal-box" style="max-width: 800px;"><h2>Batch Command Execution</h2><div style="display: flex; gap: 20px;"><div style="width: 30%; border-right: 1px solid #333; padding-right: 10px; max-height: 400px; overflow-y: auto;"><h3>Servers</h3><div><input type="checkbox" id="batch-select-all"><label for="batch-select-all"> Select All</label></div><div id="batch-server-list"></div></div><div style="width: 70%; display: flex; flex-direction: column;"><h3>Command</h3><textarea id="batch-command-input" style="height: 100px; margin-bottom: 10px;"></textarea><div style="margin-bottom: 10px;"><select id="batch-shortcuts-select" style="padding: 5px; background: #1a1a1a; color: #d4d4d4; border: 1px solid #333; width: 70%;"><option value="">Select Shortcut...</option></select><button id="batch-apply-shortcut" class="btn">Apply</button></div><div style="display: flex; justify-content: space-between;"><button id="edit-batch-shortcuts-btn" class="btn">Edit Batch Shortcuts</button><button id="batch-execute-btn" class="btn btn-primary">Run</button></div><h3>Results</h3><div id="batch-results" style="flex-grow: 1; background: #1a1a1a; border: 1px solid #333; padding: 10px; overflow-y: auto; max-height: 300px; white-space: pre-wrap; font-family: monospace;"></div></div></div><div class="editor-buttons"><button data-action="cancel-batch" class="btn">Close</button></div></div>`;
            modals.hostsEditor.innerHTML = `<div class="modal-box"><h2>Edit Hosts (hosts.json)</h2><textarea id="hosts-textarea"></textarea><div class="editor-buttons"><button data-action="cancel-edit" class="btn">Cancel</button><button data-action="save-hosts" class="btn btn-primary">Save</button></div></div>`;
            modals.shortcutsEditor.innerHTML = `<div class="modal-box"><h2>Edit Shortcuts (shortcuts.json)</h2><textarea id="shortcuts-textarea"></textarea><div class="editor-buttons"><button data-action="cancel-edit" class="btn">Cancel</button><button data-action="save-shortcuts" class="btn btn-primary">Save</button></div></div>`;
            modals.batchShortcutsEditor.innerHTML = `<div class="modal-box"><h2>Edit Batch Shortcuts (batch_shortcuts.json)</h2><textarea id="batch-shortcuts-textarea"></textarea><div class="editor-buttons"><button data-action="cancel-batch-edit" class="btn">Cancel</button><button data-action="save-batch-shortcuts" class="btn btn-primary">Save</button></div></div>`;

            const tabBar = document.getElementById('tab-bar');
            const terminalPanes = document.getElementById('terminal-panes');
            const connectBtn = document.getElementById('connect-btn');
            const connectErrorMessage = document.getElementById('connect-error-message');
            const connectLoadingSpinner = document.getElementById('connect-loading-spinner');
            const hostsTextarea = document.getElementById('hosts-textarea');
            const shortcutsTextarea = document.getElementById('shortcuts-textarea');
            const batchShortcutsTextarea = document.getElementById('batch-shortcuts-textarea');
            const newTabBtn = document.getElementById('new-tab-btn');

            let terminals = {};
            /** sessionId -> AI activity from server */
            const sessionAiState = {};
            let chatBusy = false;
            let aiUiTickTimer = null;

            function showModal(modalName) { Object.values(modals).forEach(m => m.classList.remove('active')); if (modalName) modals[modalName].classList.add('active'); }
            function getSessions() { return JSON.parse(localStorage.getItem('sshSessions') || '[]'); }
            function saveSessions(sessions) { localStorage.setItem('sshSessions', JSON.stringify(sessions)); }

            function updateSessionAiState(sessionId, meta) {
                if (!sessionId) return;
                if (!meta) {
                    delete sessionAiState[sessionId];
                    return;
                }
                sessionAiState[sessionId] = {
                    openedByAi: Boolean(meta.openedByAi),
                    aiActive: Boolean(meta.aiActive),
                    lastAction: meta.lastAction || null,
                    lastCommand: meta.lastCommand || null,
                    lastAiAt: meta.lastAiAt || null,
                };
            }

            function applyAiUiToSession(sessionId) {
                const meta = sessionAiState[sessionId] || {};
                // Badge / highlight only while AI is actively controlling (not permanently after open)
                const active = Boolean(meta.aiActive);
                const tab = document.querySelector(`.tab[data-session-id="${sessionId}"]`);
                if (tab) {
                    tab.classList.toggle('ai-owned', active);
                    tab.classList.toggle('ai-active', active);
                    let badge = tab.querySelector('.tab-ai-badge');
                    if (active) {
                        if (!badge) {
                            badge = document.createElement('span');
                            badge.className = 'tab-ai-badge';
                            const close = tab.querySelector('.tab-close');
                            if (close) tab.insertBefore(badge, close);
                            else tab.appendChild(badge);
                        }
                        badge.textContent = 'AI';
                        badge.classList.add('live');
                        badge.title = meta.lastCommand
                            ? `AI running: ${meta.lastCommand}`
                            : 'AI is controlling this terminal';
                    } else if (badge) {
                        badge.remove();
                    }
                }
                const pane = terminals[sessionId] && terminals[sessionId].pane;
                if (pane) {
                    pane.classList.toggle('ai-active-pane', active);
                    const banner = pane.querySelector('.ai-pane-banner');
                    if (banner) {
                        const cmd = banner.querySelector('code');
                        if (active && meta.lastCommand) {
                            cmd.textContent = meta.lastCommand;
                            cmd.hidden = false;
                        } else if (active) {
                            cmd.textContent = meta.lastAction || 'working…';
                            cmd.hidden = false;
                        } else {
                            cmd.hidden = true;
                        }
                    }
                }
            }

            function refreshAiControlBanner() {
                const banner = document.getElementById('ai-control-banner');
                const textEl = document.getElementById('ai-control-banner-text');
                const hostsEl = document.getElementById('ai-control-banner-hosts');
                if (!banner) return;
                const activeIds = Object.keys(sessionAiState).filter(id => sessionAiState[id].aiActive);
                const ownedIds = Object.keys(sessionAiState).filter(id => sessionAiState[id].openedByAi || sessionAiState[id].aiActive);
                const show = chatBusy || activeIds.length > 0;
                banner.classList.toggle('visible', show);
                if (!show) return;
                const hostNames = activeIds.map(id => {
                    const s = getSessions().find(x => x.sessionId === id);
                    return (s && s.hostName) || (terminals[id] && terminals[id].hostName) || id.slice(0, 8);
                });
                if (chatBusy && activeIds.length === 0) {
                    textEl.innerHTML = '<strong>AI 工作中</strong> — 連線或下指令時終端會即時開啟';
                    hostsEl.textContent = ownedIds.length ? `已追蹤 ${ownedIds.length} 個 session` : '';
                } else if (activeIds.length > 0) {
                    textEl.innerHTML = '<strong>AI 正在操作終端</strong> — 指令會出現在下方 xterm';
                    hostsEl.textContent = hostNames.length ? hostNames.join(', ') : '';
                }
            }

            function startAiUiTicker() {
                if (aiUiTickTimer) return;
                aiUiTickTimer = setInterval(() => {
                    // Local expiry fallback if poll lags
                    const now = Date.now();
                    for (const id of Object.keys(sessionAiState)) {
                        const m = sessionAiState[id];
                        if (m.aiActive && m.lastAiAt && now - m.lastAiAt > 12000) {
                            m.aiActive = false;
                            applyAiUiToSession(id);
                        }
                    }
                    refreshAiControlBanner();
                }, 1000);
            }
            startAiUiTicker();

            async function fetchWithAuth(url, options = {}) {
                const token = localStorage.getItem('authToken');
                if (!token) {
                    showLoginModal();
                    throw new Error('No auth token');
                }

                options.headers = { ...options.headers, 'Authorization': `Bearer ${token}` };

                const response = await fetch(url, options);

                if (response.status === 401 || response.status === 440) {
                    localStorage.removeItem('authToken');
                    showLoginModal();
                    throw new Error('Session expired');
                }

                if (!response.ok) {
                    const errorData = await response.json().catch(() => ({ message: 'An unknown error occurred' }));
                    throw new Error(errorData.message || errorData.error || `HTTP error! status: ${response.status}`);
                }

                return response;
            }

            function renderTabs() {
                const sessions = getSessions();
                document.querySelectorAll('.tab').forEach(t => t.remove());
                sessions.forEach(session => {
                    const tabEl = document.createElement('div');
                    tabEl.className = 'tab';
                    tabEl.dataset.sessionId = session.sessionId;
                    tabEl.innerHTML = `<span class="tab-title">${session.hostName}</span><span class="tab-close">x</span>`;
                    tabBar.insertBefore(tabEl, newTabBtn);
                    applyAiUiToSession(session.sessionId);
                });
                refreshAiControlBanner();
            }

            function activateTab(sessionId) {
                if (!terminals[sessionId]) return;
                const sessions = getSessions().map(s => ({ ...s, isActive: s.sessionId === sessionId }));
                saveSessions(sessions);
                document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.sessionId === sessionId));
                document.querySelectorAll('.terminal-pane').forEach(p => p.classList.toggle('active', p.dataset.sessionId === sessionId));
                const termInfo = terminals[sessionId];
                if (termInfo) {
                    setTimeout(() => {
                        termInfo.fitAddon.fit();
                        // After fitting, the dimensions are accurate. Send them to the backend PTY.
                        // This corrects any initial size mismatch and fixes line wrapping issues.
                        termInfo.ws.send(JSON.stringify({ type: 'resize', cols: termInfo.term.cols, rows: termInfo.term.rows }));
                    }, 0);
                    termInfo.term.focus();
                }
            }

            function createTerminal(session, ws) {
                const { sessionId, hostName, content } = session;
                const pane = document.createElement('div');
                pane.className = 'terminal-pane';
                pane.dataset.sessionId = sessionId;
                pane.innerHTML = `
                    <div class="ai-pane-banner">
                        <strong>AI 操作中</strong>
                        <span>指令由 AI 寫入此終端</span>
                        <code hidden></code>
                    </div>
                    <div class="shortcuts-bar-container">
                        <button class="scroll-btn left" data-session-id="${sessionId}" style="display: none;">&lt;</button>
                        <div id="shortcuts-bar-${sessionId}" class="shortcuts-bar"></div>
                        <button class="scroll-btn right" data-session-id="${sessionId}" style="display: none;">&gt;</button>
                    </div>
                    <div class="xterm-container"></div>
                `;
                terminalPanes.appendChild(pane);
                const term = new Terminal({ cursorBlink: true, convertEol: true });
                const fitAddon = new FitAddon.FitAddon();
                const serializeAddon = new SerializeAddon.SerializeAddon();
                term.loadAddon(fitAddon); term.loadAddon(serializeAddon);
                term.open(pane.querySelector('.xterm-container'));
                if (content) term.write(content);
                window.addEventListener('resize', () => { fitAddon.fit(); ws.send(JSON.stringify({ type: 'resize', cols: term.cols, rows: term.rows })); });
                terminals[sessionId] = { term, serializeAddon, ws, pane, fitAddon, hostName };
                applyAiUiToSession(sessionId);
                loadShortcuts(ws, term, sessionId, hostName);
                ws.onmessage = (event) => {
                    try {
                        if (event.data instanceof ArrayBuffer) {
                            // This is raw terminal data from the SSH stream.
                            // xterm.js requires a Uint8Array for binary data.
                            term.write(new Uint8Array(event.data));
                        } else {
                            const msg = JSON.parse(event.data);
                            if (msg.type === 'error') {
                                alert('Error: ' + msg.message);
                            }
                            else if (msg.type === 'request_host_selection') {
                                modals.hostSelectModal.innerHTML = `
                                    <div class="modal-box">
                                        <h2>Select a Host</h2>
                                        <p>The shortcut requires a host selection. Start typing to filter.</p>
                                        <input list="dynamic-host-list" id="dynamic-host-input" style="width: 100%; padding: 8px; box-sizing: border-box; background: #1a1a1a; color: #d4d4d4; border: 1px solid #333;" autocomplete="off" />
                                        <datalist id="dynamic-host-list">
                                            ${msg.hosts.map(h => `<option value="${h}"></option>`).join('')}
                                        </datalist>
                                        <div class="editor-buttons">
                                            <button id="cancel-host-select" class="btn">Cancel</button>
                                            <button id="confirm-host-select" class="btn btn-primary">Confirm</button>
                                        </div>
                                    </div>
                                `;
                                modals.hostSelectModal.classList.add('active');
                                document.getElementById('dynamic-host-input').focus();

                                document.getElementById('confirm-host-select').onclick = () => {
                                    const selectedHost = document.getElementById('dynamic-host-input').value;
                                    ws.send(JSON.stringify({ type: 'shortcut_execute', command: msg.command, selectedHost: selectedHost, originalHostKey: msg.requiredHostKey }));
                                    modals.hostSelectModal.classList.remove('active');
                                    term.focus();
                                };
                                document.getElementById('cancel-host-select').onclick = () => {
                                    modals.hostSelectModal.classList.remove('active');
                                    term.focus();
                                };
                            }
                        }
                    } catch (e) {
                        term.write(event.data);
                    }
                };
                ws.onclose = () => closeTab(sessionId);
                // When user types, convert the string to a Uint8Array and send as binary.
                // This is more efficient than JSON stringifying every keystroke.
                const textEncoder = new TextEncoder();
                term.onData(data => {
                    // The backend will receive this as a raw Buffer.
                    ws.send(textEncoder.encode(data));
                });
                renderTabs();
            }

            function loadShortcuts(ws, term, sessionId, hostName) {
                const shortcutsBar = document.getElementById(`shortcuts-bar-${sessionId}`);
                if (!shortcutsBar) return;
                shortcutsBar.innerHTML = '';

                const scrollLeftBtn = document.querySelector(`.scroll-btn.left[data-session-id="${sessionId}"]`);
                const scrollRightBtn = document.querySelector(`.scroll-btn.right[data-session-id="${sessionId}"]`);

                const updateScrollButtons = () => {
                    const { scrollLeft, scrollWidth, clientWidth } = shortcutsBar;
                    const isScrollable = scrollWidth > clientWidth;
                    scrollLeftBtn.style.display = isScrollable ? 'block' : 'none';
                    scrollRightBtn.style.display = isScrollable ? 'block' : 'none';
                    if (isScrollable) {
                        scrollLeftBtn.disabled = scrollLeft <= 0;
                        scrollRightBtn.disabled = scrollLeft >= (scrollWidth - clientWidth - 1); // -1 for precision
                    }
                };

                scrollLeftBtn.onclick = () => { shortcutsBar.scrollBy({ left: -200 }); };
                scrollRightBtn.onclick = () => { shortcutsBar.scrollBy({ left: 200 }); };
                shortcutsBar.onscroll = updateScrollButtons;

                fetchWithAuth('/api/shortcuts').then(r => r.json()).then(shortcuts => {
                    if (!Array.isArray(shortcuts)) return;
                    const filtered = shortcuts.filter(sc => {
                        return !sc.for || (Array.isArray(sc.for) && sc.for.includes(hostName));
                    });

                    filtered.forEach((sc) => {
                        const btn = document.createElement('button');
                        btn.className = 'btn'; btn.textContent = sc.name;
                        btn.onclick = () => { ws.send(JSON.stringify({ type: 'shortcut', command: sc.command })); term.focus(); };
                        shortcutsBar.appendChild(btn);
                    });

                    // Use a ResizeObserver to detect when the bar's content changes size
                    const resizeObserver = new ResizeObserver(updateScrollButtons);
                    resizeObserver.observe(shortcutsBar);
                    // Also check on window resize
                    window.addEventListener('resize', updateScrollButtons);
                }).catch(console.error);
            }

            function closeTab(sessionId) {
                let sessions = getSessions();
                const sessionToClose = sessions.find(s => s.sessionId === sessionId);
                if (!sessionToClose) return;
                const wasActive = sessionToClose.isActive;
                sessions = sessions.filter(s => s.sessionId !== sessionId);
                try { terminals[sessionId]?.ws.close(); } catch (_) { /* ignore */ }
                terminals[sessionId]?.term.dispose();
                terminals[sessionId]?.pane.remove();
                document.querySelector(`.tab[data-session-id="${sessionId}"]`)?.remove();
                delete terminals[sessionId];
                if (wasActive && sessions.length > 0) { sessions[0].isActive = true; activateTab(sessions[0].sessionId); }
                saveSessions(sessions);
                if (getSessions().length === 0) newTabBtn.click();
            }

            /** In-flight attaches so live-poll does not open the same session twice. */
            const attachingSessionIds = new Set();
            let sessionLivePollTimer = null;

            /**
             * Attach browser xterm to an existing server-side SSH session (AI open_host_session).
             * @param {{ activate?: boolean }} [opts] activate=false keeps focus on current tab when bulk-opening
             */
            function attachSession(sessionId, hostName, opts) {
                const activate = !opts || opts.activate !== false;
                if (!sessionId || !hostName) return Promise.resolve(false);
                if (terminals[sessionId]) {
                    if (activate) activateTab(sessionId);
                    return Promise.resolve(true);
                }
                if (attachingSessionIds.has(sessionId)) {
                    return Promise.resolve(false);
                }
                attachingSessionIds.add(sessionId);
                return new Promise((resolve) => {
                    const token = localStorage.getItem('authToken');
                    const ws = new WebSocket(`${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}/ssh?sessionId=${encodeURIComponent(sessionId)}&token=${encodeURIComponent(token)}`);
                    ws.binaryType = 'arraybuffer';
                    let opened = false;
                    const done = (ok) => {
                        attachingSessionIds.delete(sessionId);
                        resolve(ok);
                    };
                    const failTimer = setTimeout(() => {
                        if (!opened) {
                            try { ws.close(); } catch (_) { /* ignore */ }
                            done(false);
                        }
                    }, 8000);
                    ws.onopen = () => {
                        opened = true;
                        clearTimeout(failTimer);
                        let sessions = getSessions();
                        if (!sessions.some(s => s.sessionId === sessionId)) {
                            sessions.push({ sessionId, hostName, isActive: false });
                        }
                        if (activate) {
                            sessions = sessions.map(s => ({ ...s, isActive: s.sessionId === sessionId }));
                        }
                        saveSessions(sessions);
                        createTerminal({ sessionId, hostName }, ws);
                        if (activate) activateTab(sessionId);
                        else {
                            renderTabs();
                            // Ensure new pane exists but stay on previous active tab
                            const active = sessions.find(s => s.isActive) || sessions[0];
                            if (active) activateTab(active.sessionId);
                        }
                        done(true);
                    };
                    ws.onerror = () => {
                        clearTimeout(failTimer);
                        done(false);
                    };
                });
            }

            /** Pull server sessions and open any xterm tabs not yet in the UI (live during agent run). */
            async function reconcileLiveSessions(opts) {
                const activateNew = opts && opts.activateNew === true;
                try {
                    const sr = await fetchWithAuth('/api/sessions');
                    const live = await sr.json();
                    if (!Array.isArray(live)) return;

                    const liveIds = new Set(live.map(s => s.sessionId));
                    for (const s of live) {
                        if (!s.sessionId) continue;
                        updateSessionAiState(s.sessionId, s);
                        applyAiUiToSession(s.sessionId);
                    }
                    // Clear AI flags for sessions no longer reported as active AI
                    for (const id of Object.keys(sessionAiState)) {
                        if (!liveIds.has(id)) {
                            // keep openedByAi cosmetic briefly? drop if gone from server
                            delete sessionAiState[id];
                        }
                    }

                    const pending = live.filter(s => s.sessionId && s.serverName && !terminals[s.sessionId] && !attachingSessionIds.has(s.sessionId));
                    if (pending.length > 0) {
                        await Promise.all(pending.map((s, i) =>
                            attachSession(s.sessionId, s.serverName, {
                                activate: activateNew && i === pending.length - 1,
                            })
                        ));
                        renderTabs();
                    } else {
                        refreshAiControlBanner();
                    }
                } catch (_) { /* ignore while agent running */ }
            }

            function startSessionLivePoll() {
                stopSessionLivePoll();
                reconcileLiveSessions({ activateNew: true });
                sessionLivePollTimer = setInterval(() => {
                    reconcileLiveSessions({ activateNew: true });
                }, 500);
            }

            function stopSessionLivePoll() {
                if (sessionLivePollTimer) {
                    clearInterval(sessionLivePollTimer);
                    sessionLivePollTimer = null;
                }
            }

            async function processClientActions(actions) {
                if (!Array.isArray(actions)) return;
                await Promise.all(actions
                    .filter(a => a.type === 'attach_session')
                    .map(a => attachSession(a.sessionId, a.hostName, { activate: false }))
                );
                await reconcileLiveSessions({ activateNew: false });
            }

            // --- AI Chat (persisted in localStorage across browser reloads) ---
            const chatBody = document.getElementById('chat-body');
            const chatInput = document.getElementById('chat-input');
            const chatSend = document.getElementById('chat-send');
            const chatStatus = document.getElementById('chat-status');
            const chatPanel = document.getElementById('chat-panel');
            const CHAT_LOG_KEY = 'aiChatLog';
            const CHAT_HISTORY_KEY = 'aiChatHistory';
            const CHAT_ACP_SESSION_KEY = 'aiAcpSessionId';
            const CHAT_LOG_MAX = 100;
            const CHAT_HISTORY_MAX = 40;
            let chatHistory = [];
            let chatLog = [];
            let acpSessionId = null;
            let forceContextResync = false;

            function loadChatState() {
                try {
                    chatHistory = JSON.parse(localStorage.getItem(CHAT_HISTORY_KEY) || '[]');
                    if (!Array.isArray(chatHistory)) chatHistory = [];
                } catch (_) {
                    chatHistory = [];
                }
                try {
                    chatLog = JSON.parse(localStorage.getItem(CHAT_LOG_KEY) || '[]');
                    if (!Array.isArray(chatLog)) chatLog = [];
                } catch (_) {
                    chatLog = [];
                }
                acpSessionId = localStorage.getItem(CHAT_ACP_SESSION_KEY) || null;
            }

            function persistChatState() {
                try {
                    localStorage.setItem(CHAT_HISTORY_KEY, JSON.stringify(chatHistory.slice(-CHAT_HISTORY_MAX)));
                    localStorage.setItem(CHAT_LOG_KEY, JSON.stringify(chatLog.slice(-CHAT_LOG_MAX)));
                    if (acpSessionId) localStorage.setItem(CHAT_ACP_SESSION_KEY, acpSessionId);
                    else localStorage.removeItem(CHAT_ACP_SESSION_KEY);
                } catch (e) {
                    console.warn('Failed to persist chat:', e);
                }
            }

            function setAcpSessionId(id) {
                if (id && id !== acpSessionId) {
                    // Session id changed on server → next prompt may need history re-inject
                    if (acpSessionId && chatHistory.length > 0) forceContextResync = true;
                    acpSessionId = id;
                    persistChatState();
                } else if (id) {
                    acpSessionId = id;
                    persistChatState();
                }
            }

            async function clearPersistedChat() {
                chatHistory = [];
                chatLog = [];
                forceContextResync = false;
                localStorage.removeItem(CHAT_HISTORY_KEY);
                localStorage.removeItem(CHAT_LOG_KEY);
                chatBody.innerHTML = '';
                try {
                    const r = await fetchWithAuth('/api/ai/reset', { method: 'POST' });
                    const d = await r.json();
                    if (d.acpSessionId) setAcpSessionId(d.acpSessionId);
                } catch (e) {
                    console.warn('Agent session reset failed:', e);
                    acpSessionId = null;
                    localStorage.removeItem(CHAT_ACP_SESSION_KEY);
                }
                persistChatState();
            }

            /**
             * @param {string} role
             * @param {string} text
             * @param {string} [extraHtml]
             * @param {{ persist?: boolean }} [opts] persist=false for ephemeral UI (e.g. Thinking…)
             */
            function appendChatMessage(role, text, extraHtml, opts) {
                const persist = !opts || opts.persist !== false;
                const el = document.createElement('div');
                el.className = `chat-msg ${role}`;
                el.textContent = text || '';
                if (extraHtml) {
                    const extra = document.createElement('div');
                    extra.className = 'tool-trace';
                    extra.textContent = extraHtml;
                    el.appendChild(extra);
                }
                chatBody.appendChild(el);
                chatBody.scrollTop = chatBody.scrollHeight;
                if (persist) {
                    chatLog.push({ role, text: text || '', extra: extraHtml || '', ts: Date.now() });
                    if (chatLog.length > CHAT_LOG_MAX) chatLog = chatLog.slice(-CHAT_LOG_MAX);
                    persistChatState();
                }
            }

            function restoreChatUi() {
                loadChatState();
                chatBody.innerHTML = '';
                if (chatLog.length === 0) {
                    appendChatMessage('system', 'Powered by grok agent serve + ssh-mag MCP. UI + agent context stay in sync across reloads.');
                    return;
                }
                for (const m of chatLog) {
                    appendChatMessage(m.role, m.text, m.extra || '', { persist: false });
                }
                // Prefer agent resume/load; if that fails, first send will re-inject UI history
                forceContextResync = chatHistory.length > 0;
                chatBody.scrollTop = chatBody.scrollHeight;
            }

            async function refreshAiStatus() {
                try {
                    const q = acpSessionId ? `?acpSessionId=${encodeURIComponent(acpSessionId)}` : '';
                    const r = await fetchWithAuth('/api/ai/status' + q);
                    const st = await r.json();
                    if (st.acpSessionId) setAcpSessionId(st.acpSessionId);
                    if (st.needsHistoryResync && chatHistory.length > 0) {
                        forceContextResync = true;
                    } else if ((st.sessionMethod === 'resume' || st.sessionMethod === 'load') && !st.needsHistoryResync) {
                        // Agent already has this session's memory — no need to re-inject UI log
                        forceContextResync = false;
                    }
                    if (st.configured) {
                        const sync = forceContextResync ? ' · will sync context' : ' · context linked';
                        chatStatus.textContent = `Grok agent · ${st.model || 'ready'} · ${st.hosts} hosts${sync}`;
                        chatStatus.className = 'ok';
                        chatSend.disabled = false;
                    } else if (!st.secretConfigured) {
                        chatStatus.textContent = 'Set GROK_AGENT_SECRET in .env';
                        chatStatus.className = 'err';
                        chatSend.disabled = true;
                    } else {
                        chatStatus.textContent = st.agentError
                            ? `Agent offline: ${st.agentError}`
                            : 'Start: grok agent --always-approve serve';
                        chatStatus.className = 'err';
                        chatSend.disabled = true;
                    }
                } catch (e) {
                    chatStatus.textContent = 'AI status unavailable';
                    chatStatus.className = 'err';
                }
            }

            async function sendChat() {
                const text = (chatInput.value || '').trim();
                if (!text || chatBusy) return;
                chatBusy = true;
                refreshAiControlBanner();
                chatSend.disabled = true;
                chatInput.value = '';
                appendChatMessage('user', text);
                chatHistory.push({ role: 'user', content: text });
                if (chatHistory.length > CHAT_HISTORY_MAX) chatHistory = chatHistory.slice(-CHAT_HISTORY_MAX);
                persistChatState();
                const resyncThisTurn = forceContextResync;
                appendChatMessage('system',
                    resyncThisTurn
                        ? 'Thinking… (syncing context; terminals open live as hosts connect)'
                        : 'Thinking… (terminals open live as hosts connect)',
                    '',
                    { persist: false }
                );
                const thinkingEl = chatBody.lastElementChild;
                // While agent runs MCP tools, open xterm as soon as server sessions appear
                startSessionLivePoll();
                try {
                    const r = await fetchWithAuth('/api/ai/chat', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            messages: chatHistory,
                            acpSessionId,
                            forceResync: resyncThisTurn,
                        }),
                    });
                    const data = await r.json();
                    if (thinkingEl && thinkingEl.classList.contains('system')) thinkingEl.remove();
                    if (data.acpSessionId) setAcpSessionId(data.acpSessionId);
                    if (data.error && !data.reply) {
                        appendChatMessage('system', 'Error: ' + data.error + (data.hint ? '\n' + data.hint : ''));
                    } else {
                        forceContextResync = false;
                        await processClientActions(data.clientActions);
                        await reconcileLiveSessions({ activateNew: false });
                        let trace = Array.isArray(data.toolTrace) && data.toolTrace.length
                            ? 'Tools: ' + data.toolTrace.map(t => t.name).join(' → ')
                            : '';
                        if (data.contextResynced) {
                            trace = (trace ? trace + ' · ' : '') + 'context synced from UI';
                        }
                        const replyText = data.reply || data.error || '(empty)';
                        appendChatMessage('assistant', replyText, trace || undefined);
                        if (data.reply) {
                            chatHistory.push({ role: 'assistant', content: data.reply });
                            if (chatHistory.length > CHAT_HISTORY_MAX) chatHistory = chatHistory.slice(-CHAT_HISTORY_MAX);
                            persistChatState();
                        }
                    }
                } catch (e) {
                    if (thinkingEl && thinkingEl.classList.contains('system')) thinkingEl.remove();
                    appendChatMessage('system', 'Error: ' + e.message);
                } finally {
                    stopSessionLivePoll();
                    // One last pull so AI badges settle on final state
                    await reconcileLiveSessions({ activateNew: false });
                    chatBusy = false;
                    refreshAiControlBanner();
                    refreshAiStatus();
                }
            }

            chatSend.addEventListener('click', sendChat);
            // Enter = newline only; send via Send button
            document.getElementById('chat-clear').addEventListener('click', async () => {
                if (!confirm('Clear AI chat in this browser and start a fresh Grok agent session?')) return;
                await clearPersistedChat();
                appendChatMessage('system', 'Chat cleared. Agent session reset; new messages start a clean context.');
                refreshAiStatus();
            });

            const CHAT_WIDTH_KEY = 'aiChatWidth';
            const chatResizeHandle = document.getElementById('chat-resize-handle');
            function applyChatWidth(px) {
                const min = 240;
                const max = Math.min(window.innerWidth * 0.7, 720);
                const w = Math.max(min, Math.min(max, Math.round(px)));
                if (!chatPanel.classList.contains('collapsed')) {
                    chatPanel.style.width = w + 'px';
                }
                return w;
            }
            function refitActiveTerminal() {
                const active = getSessions().find(s => s.isActive);
                if (active && terminals[active.sessionId]) {
                    try { terminals[active.sessionId].fitAddon.fit(); } catch (_) { /* ignore */ }
                }
            }
            (function restoreChatWidth() {
                const saved = parseInt(localStorage.getItem(CHAT_WIDTH_KEY) || '', 10);
                if (saved > 0) applyChatWidth(saved);
            })();
            chatResizeHandle.addEventListener('mousedown', (e) => {
                if (chatPanel.classList.contains('collapsed')) return;
                e.preventDefault();
                chatPanel.classList.add('resizing');
                document.body.classList.add('chat-resizing');
                const onMove = (ev) => {
                    // Panel is on the right: width = window - mouse X
                    const w = applyChatWidth(window.innerWidth - ev.clientX);
                    localStorage.setItem(CHAT_WIDTH_KEY, String(w));
                    refitActiveTerminal();
                };
                const onUp = () => {
                    document.removeEventListener('mousemove', onMove);
                    document.removeEventListener('mouseup', onUp);
                    chatPanel.classList.remove('resizing');
                    document.body.classList.remove('chat-resizing');
                    refitActiveTerminal();
                };
                document.addEventListener('mousemove', onMove);
                document.addEventListener('mouseup', onUp);
            });

            document.getElementById('chat-toggle').addEventListener('click', () => {
                chatPanel.classList.toggle('collapsed');
                document.getElementById('chat-toggle').textContent = chatPanel.classList.contains('collapsed') ? '⟨' : '⟩';
                if (!chatPanel.classList.contains('collapsed')) {
                    const saved = parseInt(localStorage.getItem(CHAT_WIDTH_KEY) || '', 10);
                    applyChatWidth(saved > 0 ? saved : 360);
                }
                setTimeout(refitActiveTerminal, 50);
            });

            function populateServerList() {
                const serverInput = document.getElementById('server-input');
                const serverList = document.getElementById('server-list');
                if (!serverInput || !serverList) return;

                fetchWithAuth('/api/servers').then(r => r.json()).then(servers => {
                    serverList.innerHTML = '';
                    servers.forEach(s => {
                        const option = document.createElement('option');
                        option.value = s.name;
                        serverList.appendChild(option);
                    });
                    const lastSelectedHost = localStorage.getItem('lastSelectedHost');
                    if (lastSelectedHost) {
                        serverInput.value = lastSelectedHost;
                    }
                }).catch(err => {
                    console.error('Failed to populate server list:', err);
                    connectErrorMessage.textContent = 'Could not load servers. Your session may have expired.';
                });
            }

            function showLoginModal() {
                loginModal.classList.add('active');
                appContainer.style.display = 'none';
            }

            function hideLoginModal() {
                loginModal.classList.remove('active');
                appContainer.style.display = 'flex';
            }

            function logout() {
                localStorage.removeItem('authToken');
                localStorage.removeItem('sshSessions');
                // Keep AI chat in browser by default; uncomment to wipe on logout:
                // clearPersistedChat();
                Object.values(terminals).forEach(t => t.ws.close());
                terminals = {};
                document.querySelectorAll('.terminal-pane').forEach(p => p.remove());
                document.querySelectorAll('.tab').forEach(t => t.remove());
                showModal(null);
                showLoginModal();
            }

            function initializeApp() {
                hideLoginModal();
                refreshAiStatus();
                restoreChatUi();
                const sessions = getSessions();
                if (sessions.length > 0) {
                    renderTabs();
                    sessions.forEach(session => {
                        const token = localStorage.getItem('authToken');
                        const ws = new WebSocket(`${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}/ssh?sessionId=${session.sessionId}&token=${token}`);
                        ws.binaryType = 'arraybuffer'; // Ensure binary data is received as ArrayBuffer
                        createTerminal(session, ws);
                    });
                    const activeSession = sessions.find(s => s.isActive);
                    if (activeSession) activateTab(activeSession.sessionId);
                    else if (sessions.length > 0) activateTab(sessions[0].sessionId);
                } else {
                    newTabBtn.click();
                }
            }

            // --- Event Listeners ---
            newTabBtn.addEventListener('click', () => { populateServerList(); showModal('connect'); });
            document.getElementById('connect-btn').addEventListener('click', () => {
                const serverName = document.getElementById('server-input').value;
                if (serverName === '') return;
                const connectErrorMessage = document.getElementById('connect-error-message');
                const connectLoadingSpinner = document.getElementById('connect-loading-spinner');
                const connectBtn = document.getElementById('connect-btn');
                const serverInput = document.getElementById('server-input');

                connectErrorMessage.textContent = '';
                connectLoadingSpinner.style.display = 'block';
                connectBtn.disabled = true;
                serverInput.disabled = true;

                localStorage.setItem('lastSelectedHost', serverName);

                const token = localStorage.getItem('authToken');
                const ws = new WebSocket(`${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}/ssh?server=${serverName}&token=${token}`);
                ws.binaryType = 'arraybuffer'; // Ensure binary data is received as ArrayBuffer

                ws.onmessage = (event) => {
                    try {
                        const msg = JSON.parse(event.data);
                        if (msg.type === 'session') {
                            ws.onmessage = null;
                            let sessions = getSessions();
                            sessions.forEach(s => s.isActive = false);
                            sessions.push({ sessionId: msg.sessionId, hostName: serverName, isActive: true });
                            saveSessions(sessions);
                            createTerminal({ sessionId: msg.sessionId, hostName: serverName }, ws);
                            activateTab(msg.sessionId);
                            connectLoadingSpinner.style.display = 'none';
                            connectBtn.disabled = false;
                            serverInput.disabled = false;
                            showModal(null);
                        } else if (msg.type === 'error') {
                            connectErrorMessage.textContent = msg.message;
                            connectLoadingSpinner.style.display = 'none';
                            connectBtn.disabled = false;
                            serverInput.disabled = false;
                            ws.close();
                        }
                    } catch (e) { /* Ignore */ }
                };
                ws.onclose = () => {
                    if (modals.connect.classList.contains('active')) {
                        connectLoadingSpinner.style.display = 'none';
                        connectBtn.disabled = false;
                        serverInput.disabled = false;
                    }
                };
            });
            document.getElementById('logout-btn').addEventListener('click', logout);
            document.getElementById('edit-hosts-btn').addEventListener('click', () => fetchWithAuth('/api/hosts-config').then(r => r.json()).then(d => { hostsTextarea.value = d.config; showModal('hostsEditor'); }).catch(err => alert('Error: ' + err.message)));
            document.getElementById('edit-shortcuts-btn').addEventListener('click', () => fetchWithAuth('/api/shortcuts-config').then(r => r.json()).then(d => { shortcutsTextarea.value = d.config; showModal('shortcutsEditor'); }).catch(err => alert('Error: ' + err.message)));
            document.getElementById('batch-run-btn').addEventListener('click', () => {
                fetchWithAuth('/api/servers').then(r => r.json()).then(servers => {
                    const list = document.getElementById('batch-server-list');
                    list.innerHTML = '';
                    servers.forEach(s => {
                        const div = document.createElement('div');
                        div.innerHTML = `<input type="checkbox" class="batch-server-checkbox" value="${s.name}" id="batch-server-${s.name}"><label for="batch-server-${s.name}"> ${s.name}</label>`;
                        list.appendChild(div);
                    });
                    document.getElementById('batch-results').textContent = '';
                    document.getElementById('batch-command-input').value = '';
                    loadBatchShortcuts();
                    showModal('batchRun');
                });
            });

            function loadBatchShortcuts() {
                const select = document.getElementById('batch-shortcuts-select');
                fetchWithAuth('/api/batch-shortcuts').then(r => r.json()).then(shortcuts => {
                    select.innerHTML = '<option value="">Select Shortcut...</option>';
                    if (Array.isArray(shortcuts)) {
                        shortcuts.forEach(sc => {
                            const option = document.createElement('option');
                            option.value = sc.command;
                            option.textContent = sc.name;
                            select.appendChild(option);
                        });
                    }
                });
            }

            document.getElementById('batch-apply-shortcut').addEventListener('click', () => {
                const select = document.getElementById('batch-shortcuts-select');
                const commandInput = document.getElementById('batch-command-input');
                if (select.value) {
                    commandInput.value = select.value;
                }
            });

            document.getElementById('edit-batch-shortcuts-btn').addEventListener('click', () => {
                fetchWithAuth('/api/batch-shortcuts-config').then(r => r.json()).then(d => {
                    batchShortcutsTextarea.value = d.config;
                    showModal('batchShortcutsEditor');
                }).catch(err => alert('Error: ' + err.message));
            });

            document.getElementById('batch-select-all').addEventListener('change', (e) => {
                document.querySelectorAll('.batch-server-checkbox').forEach(cb => cb.checked = e.target.checked);
            });
            document.getElementById('batch-execute-btn').addEventListener('click', async () => {
                const selectedServers = Array.from(document.querySelectorAll('.batch-server-checkbox:checked')).map(cb => cb.value);
                const command = document.getElementById('batch-command-input').value;
                const resultsDiv = document.getElementById('batch-results');

                if (selectedServers.length === 0) return alert('Please select at least one server.');
                if (!command) return alert('Please enter a command.');

                resultsDiv.textContent = 'Running...';
                document.getElementById('batch-execute-btn').disabled = true;

                try {
                    const response = await fetchWithAuth('/api/batch-execute', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ hostNames: selectedServers, command })
                    });
                    const results = await response.json();
                    resultsDiv.innerHTML = '';
                    results.forEach(res => {
                        const div = document.createElement('div');
                        div.style.marginBottom = '10px';
                        div.style.borderBottom = '1px solid #444';
                        div.style.paddingBottom = '5px';
                        const statusColor = res.code === 0 ? '#4caf50' : '#f44336';
                        div.innerHTML = `<strong style="color: ${statusColor}">${res.server} (Exit Code: ${res.code})</strong><br>`;
                        if (res.error) div.innerHTML += `<span style="color: #f44336">Error: ${res.error}</span><br>`;
                        if (res.output) div.innerHTML += `<span>${res.output}</span>`;
                        resultsDiv.appendChild(div);
                    });
                } catch (err) {
                    resultsDiv.textContent = 'Error: ' + err.message;
                } finally {
                    document.getElementById('batch-execute-btn').disabled = false;
                }
            });
            document.body.addEventListener('click', (e) => {
                const action = e.target.dataset.action;
                if (action === 'cancel-edit' || action === 'cancel-batch') showModal('connect');
                if (action === 'cancel-batch-edit') showModal('batchRun');
                if (action === 'save-hosts') fetchWithAuth('/api/hosts-config', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ config: hostsTextarea.value }) }).then(r => r.json()).then(d => { if (!d.success) throw new Error(d.error); alert('Hosts saved!'); populateServerList(); showModal('connect'); }).catch(err => alert('Save failed: ' + err.message));
                if (action === 'save-shortcuts') fetchWithAuth('/api/shortcuts-config', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ config: shortcutsTextarea.value }) }).then(r => r.json()).then(d => { if (!d.success) throw new Error(d.error); alert('Shortcuts saved!'); showModal('connect'); }).catch(err => alert('Save failed: ' + err.message));
                if (action === 'save-batch-shortcuts') fetchWithAuth('/api/batch-shortcuts-config', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ config: batchShortcutsTextarea.value }) }).then(r => r.json()).then(d => { if (!d.success) throw new Error(d.error); alert('Batch Shortcuts saved!'); loadBatchShortcuts(); showModal('batchRun'); }).catch(err => alert('Save failed: ' + err.message));
            });
            Object.values(modals).forEach(modal => {
                modal.addEventListener('click', (e) => { if (e.target === modal) showModal(null); });
            });
            tabBar.addEventListener('click', (e) => {
                const tab = e.target.closest('.tab');
                if (!tab) return;
                if (e.target.classList.contains('tab-close')) closeTab(tab.dataset.sessionId);
                else activateTab(tab.dataset.sessionId);
            });
            window.addEventListener('beforeunload', () => {
                let sessions = getSessions();
                if (sessions.length === 0) return;
                sessions.forEach(session => { const termInfo = terminals[session.sessionId]; if (termInfo) session.content = termInfo.serializeAddon.serialize(); });
                saveSessions(sessions);
            });

            document.getElementById('login-btn').addEventListener('click', async () => {
                const username = document.getElementById('username-input').value;
                const password = document.getElementById('password-input').value;
                const errorMessage = document.getElementById('login-error-message');
                errorMessage.textContent = '';

                try {
                    const response = await fetch('/api/login', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ username, password })
                    });
                    const data = await response.json();
                    if (data.success) {
                        localStorage.setItem('authToken', data.token);
                        initializeApp();
                    } else {
                        errorMessage.textContent = data.message || 'Login failed.';
                    }
                } catch (error) {
                    errorMessage.textContent = 'An error occurred during login.';
                }
            });

            // --- Initial Load ---
            if (localStorage.getItem('authToken')) {
                initializeApp();
            } else {
                showLoginModal();
            }
        });
    </script>
</body>

</html>
